<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 208" width="840" height="208" role="img" aria-label="MERT: frontend and mobile developer">
  <style>
    text { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; fill: #ff5fd2; }
    .dim { fill: #b8479c; }
    .glow { filter: url(#glow); }
    .cursor { animation: blink 1s steps(1) infinite; }
    .screen { animation: flicker 6s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes flicker { 0%, 96%, 100% { opacity: 1; } 97% { opacity: .82; } 98% { opacity: 1; } 99% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .screen { animation: none; } }
  </style>
  <defs>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".35"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".75"/>
    </radialGradient>
  </defs>

  <rect width="840" height="208" rx="14" fill="#18060f"/>
  <g class="screen">
    <text x="28" y="30" font-size="13" class="dim">MERT-OS v2026.10 ── 640K OK ── READY</text>
    <text x="28" y="60" font-size="13" class="glow" xml:space="preserve">
      <tspan x="28" dy="0">███╗   ███╗███████╗██████╗ ████████╗</tspan>
      <tspan x="28" dy="15">████╗ ████║██╔════╝██╔══██╗╚══██╔══╝</tspan>
      <tspan x="28" dy="15">██╔████╔██║█████╗  ██████╔╝   ██║   </tspan>
      <tspan x="28" dy="15">██║╚██╔╝██║██╔══╝  ██╔══██╗   ██║   </tspan>
      <tspan x="28" dy="15">██║ ╚═╝ ██║███████╗██║  ██║   ██║   </tspan>
      <tspan x="28" dy="15">╚═╝     ╚═╝╚══════╝╚═╝  ╚═╝   ╚═╝   </tspan>
    </text>
    <text x="530" y="58" font-size="15" class="glow" xml:space="preserve">
      <tspan x="530" dy="0">@yucesoymert</tspan>
      <tspan x="530" dy="20" class="dim">───────────────</tspan>
      <tspan x="530" dy="20">os ······ macOS</tspan>
      <tspan x="530" dy="20">shell ··· zsh</tspan>
      <tspan x="530" dy="20">lang ···· TS · Swift</tspan>
      <tspan x="530" dy="20">uptime ·· since 2022</tspan>
    </text>
    <text x="28" y="166" font-size="16" class="glow">&gt; frontend &amp; mobile developer · Turkey</text>
    <text x="28" y="190" font-size="16" class="glow">&gt; react · next.js · expo · swiftui <tspan class="cursor">█</tspan></text>
  </g>
  <rect width="840" height="208" rx="14" fill="url(#scan)"/>
  <rect width="840" height="208" rx="14" fill="url(#vignette)"/>
  <!-- sprite --><style>
    .mf { opacity: 0; image-rendering: pixelated; animation: mf 0.8s steps(1) infinite; }
    @keyframes mf { 0% { opacity: 1; } 12.500% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .mf { animation: none; } .mf:first-of-type { opacity: 1; } }
  </style>
  <g aria-hidden="true"><image class="mf" style="animation-delay:-0.0s" x="762" y="120" width="63" height="84" href="data:image/png;base64,"/><image class="mf" style="animation-delay:-0.7s" x="762" y="120" width="63" height="84" href="data:image/png;base64,"/><image class="mf" style="animation-delay:-0.6s" x="762" y="120" width="63" height="84" href="data:image/png;base64,"/><image class="mf" style="animation-delay:-0.5s" x="762" y="120" width="63" height="84" href="data:image/png;base64,"/><image class="mf" style="animation-delay:-0.4s" x="762" y="120" width="63" height="84" href="data:image/png;base64,"/><image class="mf" style="animation-delay:-0.3s" x="762" y="120" width="63" height="84" href="data:image/png;base64,"/><image class="mf" style="animation-delay:-0.2s" x="762" y="120" width="63" height="84" href="data:image/png;base64,"/><image class="mf" style="animation-delay:-0.1s" x="762" y="120" width="63" height="84" href="data:image/png;base64,"/></g><!-- /sprite -->

</svg>
